[package]
name = "pass-ffi"
version = "0.1.0"
authors = ["BigToEstDev"]
edition = "2021"
publish = false
## The core is GPL-3.0 and this crate links it statically, so the shared library and the apk that
## carries it are GPL-3.0 as well. See plan/todo/android/naming-and-license.md in pass-docs.
license = "GPL-3.0-only"

[lib]
## The jni bridge is loaded by the jvm as a shared library. "lib" is kept alongside so the crate can
## also be built and unit tested on the host, where there is no Android at all.
crate-type = ["cdylib", "lib"]

[dependencies]
## The core lives in its own repository, checked out next to pass-app. Moves to git + rev once there
## is a CI that cannot rely on a sibling directory.
kdbx-rust-core = { path = "../../../pass-rust-core" }

## Jni bindings. This crate is the only place in the project allowed to contain unsafe code: the core
## is #![forbid(unsafe_code)] and cannot host a #[no_mangle] function at all.
jni = "0.21"

## Wiping buffers that held a password. Already in the tree as a dependency of the core, declared here
## because this crate wipes its own copies at the boundary - nothing new is pulled in.
zeroize = "1"

## The content of a key file travels base64 inside the json arguments (see src/key_file.rs). Already in
## the tree as a dependency of the core, the same version - nothing new is pulled in.
base64 = "0.22.1"

## The uuids of groups and entries travel as strings and are parsed by serde before any database is
## touched. The same version the core already depends on, so cargo resolves it to one crate and the
## types are the ones the core's signatures ask for.
uuid = { version = "1.18.1", features = ["serde"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

## The log facade, with the ceiling for release builds compiled in. `release_max_level_warn` makes the
## macros below warn expand to nothing when `debug_assertions` are off, so the strings never reach the
## `.so` and there is no runtime check to skip them - a filter set at startup would leave both. The
## feature is on the `log` crate itself, so it applies to the core too: cargo resolves one `log` for the
## whole build. What it keeps out of logcat is the path of the database file and its name, which the core
## logs at debug level on every read and write.
log = { version = "0.4", features = ["release_max_level_warn"] }

## Routes the core's log macros to logcat. Android only - on the host the crate builds without it.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
